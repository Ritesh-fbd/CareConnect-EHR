server:
  port: 8080
spring:
  datasource:
    url: jdbc:h2:mem:ehr;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  jwt:
    # Change this in real use (min 32 characters). Prefer an environment variable.
    secret: ${JWT_SECRET:change-this-development-secret-key-at-least-32-chars}
